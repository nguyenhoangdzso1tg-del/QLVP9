<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <meta charset="UTF-8">
  
  <title>Danh sách vi phạm</title>
  <style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #f1f5f9;
    margin: 0;
    padding: 30px;
  }

  h2 {
    text-align: center;
    color: #48556a;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: clip; /* clip giữ bo góc, KHÔNG tạo vùng cuộn -> sticky vẫn chạy */
    box-shadow: 0 10px 25px rgba(73, 68, 68, 0.859);
  }

  thead {
    background: #22419e;
    color: white;
  }
  th, td {
    padding: 12px 10px;
    text-align: center;
    font-size: 14px;
  }

  /* Header dính phía trên khi cuộn danh sách */
  thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #22419e;
    box-shadow: inset 0 -2px 0 rgba(255,255,255,0.25), 0 2px 6px rgba(0,0,0,0.15);
  }

  tbody tr:nth-child(even) {
    background: #f8fafc;
  }

  tbody tr:hover {
    background: #e0f2fe;
    transition: 0.2s;
  }

  tbody tr.selected-row {
    background: #fee2e2 !important;
  }

  .btn-delete {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  .btn-delete:hover {
    background: #dc2626;
  }

  .empty {
    text-align: center;
    padding: 20px;
    color: #64748b;
  }
.filter-box {
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.filter-box .left {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-btn {
  margin-top: 0;
  background: #2858c7;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}

.filter-btn:hover {
  background: #2a41b1;
}

.filter-btn.gray {
  background: #245ca6;
}

.filter-btn.gray:hover {
  background: #204983;
}

/* Nút thùng rác & multi-delete */
.btn-trash {
  background: #ef4444;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-trash:hover {
  background: #dc2626;
}
.btn-trash.active {
  background: #b91c1c;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
}

.btn-confirm-delete {
  background: #dc2626;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 8px;
}
.btn-confirm-delete:hover {
  background: #b91c1c;
}
.btn-confirm-delete.show {
  display: inline-flex;
}

.btn-cancel-select {
  background: #64748b;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 8px;
}
.btn-cancel-select:hover {
  background: #475569;
}
.btn-cancel-select.show {
  display: inline-flex;
}

.col-select {
  width: 40px;
  display: none;
}
.col-select.show {
  display: table-cell;
}

.select-checkbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #ef4444;
}

#selectAllWrap {
  display: none;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #334155;
}
#selectAllWrap.show {
  display: inline-flex;
}

/* Khối xóa cả tháng (admin) — có khoảng cách, gọn gàng */
.month-delete-wrap {
  display: none;
  align-items: center;
  gap: 8px;
}
#filterMonth {
  padding: 10px 14px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  min-height: 44px;
  box-sizing: border-box;
}
@media (max-width: 768px) {
  #filterMonth { width: 100%; min-width: 0; }
  .month-delete-wrap { flex-direction: column; align-items: stretch; width: 100%; }
}

</style>
</head>
<body>
<a href="index.html" class="btn" style="margin-bottom:16px;">
  <i class="fa-solid fa-arrow-left"></i> Quay lại nhập vi phạm
</a>

<h2>Danh sách vi phạm — <span id="cosoTitle" style="color:#2563eb;">…</span></h2>
<script>
  // Hiện tên cơ sở đang xem ngay trên tiêu đề
  const cosoTitle = document.getElementById("cosoTitle");
  if (cosoTitle) {
    const c = localStorage.getItem("coso");
    cosoTitle.textContent = c ? "Cơ sở " + c : "Chưa chọn cơ sở";
  }
</script>
<div class="filter-box">
  <div class="left">
    <input type="date" id="filterDate">
    <button class="filter-btn" id="btnFilter">Lọc</button>
    <button class="filter-btn gray" id="btnClear">Tất cả</button>
        

    <!-- Chỉ hiện khi đã Lọc 1 ngày -->
    <button type="button" class="filter-btn" id="btnExport"
      style="display:none; background:#059669;">
      Xuất Excel
    </button>
    <button type="button" class="filter-btn" id="btnExportSang"
      style="display:none; background:#059669;" title="Xuất các bản ghi BUỔI SÁNG đã lọc">
      Xuất buổi sáng
    </button>
    <button type="button" class="filter-btn" id="btnExportChieu"
      style="display:none; background:#059669;" title="Xuất các bản ghi BUỔI CHIỀU đã lọc">
      Xuất buổi chiều
    </button>

    <!-- Chỉ admin: xóa toàn bộ 1 tháng -->
    <span id="monthDeleteWrap" class="month-delete-wrap" style="display:none;">
      <input type="month" id="filterMonth" title="Chọn tháng cần xóa">
      <button type="button" class="filter-btn" id="btnDeleteMonth" style="background:#dc2626;">
        <i class="fa-solid fa-trash-can"></i> Xóa cả tháng
      </button>
    </span>

<!-- Admin -->
<!-- Admin -->
<button type="button" class="filter-btn" id="btnAdmin"
  style="background:#7c3aed;">
  Admin
</button>
<button type="button" class="filter-btn gray" id="btnAdminOut"
  style="display:none;">
  <i class="fa-solid fa-lock"></i> Thoát Admin
</button>

<!-- Form mật khẩu (ẩn mặc định) -->
<div id="adminLoginBox" style="
  display:none; width:100%; max-width:320px;
  background:#fff; border:1px solid #cbd5e1; border-radius:10px;
  padding:12px; margin-top:4px; box-shadow:0 4px 12px rgba(0,0,0,.08);
">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:#334155;">
    Đăng nhập Admin để xóa vi phạm
  </div>
  <input type="password" id="adminPassword" placeholder="Mật khẩu"
    style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;">
  <div style="display:flex;gap:8px;margin-top:10px;">
    <button type="button" class="filter-btn" id="btnAdminLogin" style="flex:1;">Đăng nhập</button>
    <button type="button" class="filter-btn gray" id="btnAdminCancel" style="flex:1;">Hủy</button>
  </div>
  <div id="adminMsg" style="margin-top:8px;font-size:13px;color:#dc2626;"></div>
</div>
    <!-- Nút thùng rác: bật chế độ chọn nhiều -->
    <button class="btn-trash" id="btnTrash" title="Xóa nhiều" style="display:none;">
      <i class="fa-solid fa-trash"></i> Xóa nhiều
    </button>

    <!-- Chỉ hiện khi đang chọn nhiều -->
    <span id="selectAllWrap">
      <input type="checkbox" id="selectAll" class="select-checkbox">
      <label for="selectAll">Chọn tất cả</label>
    </span>
    <button class="btn-confirm-delete" id="btnConfirmDelete">
      <i class="fa-solid fa-trash-can"></i> Xóa đã chọn (<span id="selectedCount">0</span>)
    </button>
    <button class="btn-cancel-select" id="btnCancelSelect">
      <i class="fa-solid fa-xmark"></i> Hủy
    </button>
  </div>
  <div id="paginationTop"></div>
</div>

<table border="1">
  <thead>
  <tr>
    <th class="col-select" id="thSelect">
      <input type="checkbox" id="selectAllHeader" class="select-checkbox" title="Chọn tất cả trang này">
    </th>
    <th>Mã SV</th>
    <th>Họ tên</th>
    <th>Lớp</th>
    <th>Khóa</th>
    <th>Khoa</th>
    <th>Ngày</th>
    <th>Buổi</th>
    <th>Vi phạm</th>
    <th>Thời gian nhập</th>
    <th>Người nhập</th>
    <th>Xóa</th>
  </tr>
</thead>

  <tbody id="list"></tbody>
</table>
<div id="pagination" style="margin-top:20px; text-align:right;"></div>
<script type="module">
const name = localStorage.getItem("nguoiNhap");
const coso = localStorage.getItem("coso");

if(!name || !coso){
  window.location.href = "login.html";
}
</script>

<script>
function goBackWeb1() {
  window.location.href = "index.html"; 
}
</script>
<link rel="stylesheet" href="style.css">
<script type="module" src="list.js"></script>
<div id="undoToast" style="
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #4d5461;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  display: none;
  z-index: 999;
">
  Đã xóa vi phạm
  <button onclick="undoDelete()" style="
    margin-left:10px;
    background:#22c55e;
    border:none;
    padding:10px 20px;
    color:white;
    border-radius:5px;
    cursor:pointer;
  ">Hoàn tác</button>
</div>
</body>
</html>
