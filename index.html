    history.push(showKhoa);
    selected.khoa = khoa;
    updateStatus();
    showKhoaHoc(khoa);
  });
}

function sortKhoaHocKeys(keys) {
  function rank(name) {
    const s = String(name)
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "") // bỏ dấu để bắt "CĐ" / "CD"
      .replace(/\s+/g, "");

    // CĐ9+K5 / CD9+K5 / CĐ9K5
    let m = s.match(/CD9\+?K(\d+)/) || s.match(/CĐ9\+?K(\d+)/);
    if (m) return 100 + Number(m[1]); // 105, 106, 107...

    // CĐ K18 / CDK18 / K18
    m = s.match(/CDK(\d+)/) || s.match(/[^A-Z]K(\d+)$/) || s.match(/^K(\d+)/);
    if (m) return 200 + Number(m[1]); // 218, 219, 220...

    // còn lại
    m = s.match(/K(\d+)/);
    if (m) return 300 + Number(m[1]);
    return 900;
  }

  return [...keys].sort((a, b) => {
    const d = rank(a) - rank(b);
    if (d !== 0) return d;
    return String(a).localeCompare(String(b), "vi");
  });
}

function showKhoaHoc(khoa) {
  selected.khoa = khoa;
  selected.khoaHoc = null;
  selected.lop = null;
  selected.sv = null;
  updateStatus();

  document.getElementById("title").innerText = "Chọn khóa";

  const raw = Object.keys(data[khoa] || {});
  const keys = sortKhoaHocKeys(raw);

  // Gỡ comment dòng dưới nếu muốn xem trên Console (F12) tên khóa thực tế
  // console.log("Khóa raw:", raw, "→ sorted:", keys);

  renderButtons(keys, khoaHoc => {
    history.push(() => showKhoaHoc(khoa));
    selected.khoaHoc = khoaHoc;
    updateStatus();
    showLop(khoa, khoaHoc);
  });
}

function showLop(khoa, khoaHoc) {
  selected.khoa = khoa;
  selected.khoaHoc = khoaHoc;
  selected.lop = null;
  selected.sv = null;
  updateStatus();

  document.getElementById("title").innerText = "Chọn lớp";
  renderButtons(Object.keys(data[khoa][khoaHoc]), lop => {
    history.push(() => showLop(khoa, khoaHoc));
    selected.lop = lop;
    updateStatus();
    showSinhVien(khoa, khoaHoc, lop);
  });
}

async function showSinhVien(khoa, khoaHoc, lop) {
  selected.khoa = khoa;
  selected.khoaHoc = khoaHoc;
  selected.lop = lop;
  selected.sv = null;
  updateStatus();
  document.getElementById("title").innerText = "Danh sách sinh viên";

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="col-span-3 mb-4 relative">
      <input
        type="text"
        id="searchSV"
        placeholder="🔍  Tìm sinh viên..."
        class="w-full p-2 border rounded"
        oninput="autoCompleteSV('${khoa}', '${khoaHoc}', '${lop}')"
      >
      <div id="suggestBox"
        class="absolute bg-white border w-full rounded shadow z-10 hidden">
      </div>
    </div>
  `;

  const loading = document.createElement("div");
  loading.id = "svLoading";
  loading.className = "col-span-3 text-gray-500 p-2";
  loading.innerText = "Đang tải sinh viên...";
  content.appendChild(loading);

  try {
    // Chỉ tải đúng lớp đang mở (không tải toàn bộ 5.000 SV)
    const { getStudentsByClass } = await import("./student-data.js");
    const list = await getStudentsByClass(khoa, khoaHoc, lop);
    data[khoa][khoaHoc][lop] = list;

    const el = document.getElementById("svLoading");
    if (el) el.remove();
    renderSinhVienList(list);
  } catch (e) {
    console.error(e);
    const el = document.getElementById("svLoading");
    if (el) el.innerText = "Lỗi tải sinh viên: " + (e.message || e);
  }
}
function renderSinhVienList(list) {
  const content = document.getElementById("content");
  content.querySelectorAll("button").forEach(b => b.remove());

  list.forEach(sv => {
    const btn = document.createElement("button");
    btn.className = "bg-white p-4 rounded shadow hover:bg-blue-100 text-left";

    btn.innerHTML = `
      <div class="font-semibold">${escHtml(sv.tenSV)}</div>
      <div class="text-xs text-gray-500">${escHtml(sv.maSV)}</div>
    `;

    btn.onclick = () => {
      history.push(() => showSinhVien(selected.khoa, selected.khoaHoc, selected.lop));
      selected.sv = sv;
      showViPham();
    };

    content.appendChild(btn);
  });
}

// ================= ADD VIOLATION =================
function addViolation() {
  const date = document.getElementById("date").value;
  const buoi = document.getElementById("buoi").value;

  if (!date) {
    alert("Vui lòng chọn ngày!");
    return;
  }

  let violations = [];


  // 1. Lỗi có sẵn
  document.querySelectorAll(".vipham:checked").forEach(cb => {
    violations.push(cb.value);
  });

  // 2. Lỗi khác
  const otherCheckbox = document.getElementById("viphamKhac");
  const otherInput = document.getElementById("otherViolation");

  if (otherCheckbox.checked) {
    if (otherInput.value.trim() === "") {
      alert("Vui lòng nhập lỗi vi phạm khác!");
      return;
    }
    violations.push(otherInput.value.trim());
  }

  if (violations.length === 0) {
    alert("Chưa chọn lỗi vi phạm!");
    return;
  }
  // 3. Thêm vào danh sách
  violationList.push({
    "Mã SV": selected.sv.maSV,
    "Họ tên": selected.sv.tenSV,
    "Lớp": selected.lop,
    "Khóa": selected.khoaHoc,
    "Khoa": selected.khoa,
    "Ngày": date,
    "Buổi": buoi.toUpperCase().replace("Á", "A").replace("Ề", "E"), // SANG / CHIEU
    "Vi phạm": violations.join(", "),
    "Người nhập": localStorage.getItem("nguoiNhap")
  });

  saveData();
  renderViolationTable();

  alert("Đã thêm vào danh sách vi phạm");
}

async function exportExcel() {
  if (violationList.length === 0) {
    alert("Chưa có dữ liệu!");
    return;
  }

  if (isSending) return;

  if (!confirm("Gửi dữ liệu lên hệ thống chung?")) return;

  isSending = true;

  try {
    await window.sendViolations(violationList);
    alert("Đã gửi thành công!");
    violationList = [];
    saveData();
    renderViolationTable();
  } catch (e) {
    console.error(e);
    // sendViolations đã gỡ khỏi violationList những bản gửi THÀNH CÔNG,
    // nên giờ đây chỉ còn phần CHƯA gửi → lưu lại phần đó
    saveData();
    renderViolationTable();
    alert("Gửi thất bại. Kiểm tra mạng rồi thử lại.\nPhần chưa gửi vẫn còn trên máy, không bị mất.");
  }

  isSending = false;
}

//AUTOCOMPLETE
function autoCompleteSV(khoa, khoaHoc, lop) {
  const keyword = document.getElementById("searchSV").value;
  const box = document.getElementById("suggestBox");

  if (!keyword.trim()) {
    box.classList.add("hidden");
    return;
  }

  const list = data[khoa][khoaHoc][lop].filter(sv =>
    matchesSearch(sv, keyword, { khoa, khoaHoc, lop })
  );

  box.innerHTML = "";
  box.classList.remove("hidden");

  list.forEach(sv => {
    const div = document.createElement("div");
    div.className = "p-2 hover:bg-blue-100 cursor-pointer";

    div.innerHTML = `
      <div class="font-medium">${escHtml(sv.tenSV)}</div>
      <div class="text-xs text-gray-500">${escHtml(sv.maSV)}</div>
    `;

    div.onclick = () => {
      document.getElementById("searchSV").value = `${sv.tenSV} (${sv.maSV})`;
      box.classList.add("hidden");

      history.push(() => showSinhVien(khoa, khoaHoc, lop));
      selected.sv = sv;
      showViPham();
    };

    box.appendChild(div);
  });
}

function getAllSinhVien() {
  const result = [];

  for (const khoa in data) {
    for (const khoaHoc in data[khoa]) {
      for (const lop in data[khoa][khoaHoc]) {
        data[khoa][khoaHoc][lop].forEach(sv => {
          result.push({
            ...sv,
            khoa,
            khoaHoc,
            lop
          });
        });
      }
    }
  }

  return result;
}
function normText(s) {
  return String(s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// Khớp khi MỌI từ khóa đều có trong: tên / mã SV / lớp / khóa / khoa.
// Gõ "nguyễn hoàng k5", "Nguyễn Hoàng K5" hay "nguyen hoang k5" đều được.
function matchesSearch(sv, keyword, extra) {
  const tokens = normText(keyword).split(" ").filter(Boolean);
  if (tokens.length === 0) return false;
  const hay = normText(
    [sv.tenSV, sv.maSV, extra.lop, extra.khoaHoc, extra.khoa].join(" ")
  );
  return tokens.every(t => hay.includes(t));
}

function escHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function selectGlobalStudent(sv) {
  const box = document.getElementById("globalResult");
  box.classList.add("hidden");
  document.getElementById("globalSearch").value = "";

  // RESET HISTORY (rất quan trọng)
  history = [];

  // PUSH LẠI ĐẦY ĐỦ LUỒNG
  history.push(showKhoa);
  history.push(() => showKhoaHoc(sv.khoa));
  history.push(() => showLop(sv.khoa, sv.khoaHoc));
  history.push(() => showSinhVien(sv.khoa, sv.khoaHoc, sv.lop));

  // SET STATE
  selected.khoa = sv.khoa;
  selected.khoaHoc = sv.khoaHoc;
  selected.lop = sv.lop;
  selected.sv = { tenSV: sv.tenSV, maSV: sv.maSV };

  updateStatus();
  showViPham();
}

  box.innerHTML = "";

  if (matched.length === 0) {
    box.innerHTML = `<div class="p-2 text-gray-500">Không tìm thấy theo tên/mã SV.</div>`;

    // Tìm sâu: chỉ tải toàn bộ khi người dùng chủ động bấm (tránh tốn lượt đọc)
    const deepBtn = document.createElement("button");
    deepBtn.type = "button";
    deepBtn.className = "block w-full text-left p-2 text-blue-600 hover:bg-blue-50 text-sm";
    deepBtn.textContent = "Tìm trong toàn bộ danh sách (tốn ~5.000 lượt đọc)";
    deepBtn.onclick = async () => {
      if (!confirm(
        "Tìm trong toàn bộ danh sách sẽ tải toàn bộ sinh viên về máy " +
        "(khoảng 5.000 lượt đọc Firestore). Chỉ nên dùng khi thật sự cần.\n\nTiếp tục?"
      )) return;

      deepBtn.disabled = true;
      deepBtn.textContent = "Đang tải toàn bộ...";

      try {
        const { loadAllStudents } = await import("./student-data.js");
        const all = await loadAllStudents();
        const allow = new Set(favKhoa(getCoso()));

        const found = all.filter((sv) =>
          allow.has(sv.khoa) &&
          matchesSearch(sv, keyword, {
            khoa: sv.khoa,
            khoaHoc: sv.khoaHoc,
            lop: sv.lop
          })
        ).slice(0, 50);

        renderGlobalResults(found, keyword);
      } catch (e) {
        console.error(e);
        box.innerHTML = `<div class="p-2 text-red-500">Lỗi tìm kiếm: ${escHtml(e.message || e)}</div>`;
      }
    };

    box.appendChild(deepBtn);
    box.classList.remove("hidden");
    return;
  }

  matched.forEach((sv) => {
    const div = document.createElement("div");
    div.className = "p-2 hover:bg-blue-100 cursor-pointer";

    div.innerHTML = `
      <div class="font-medium">${escHtml(sv.tenSV)}</div>
      <div class="text-xs text-gray-500">
        ${escHtml(sv.maSV)} — ${escHtml(sv.lop)} — ${escHtml(sv.khoaHoc)}
      </div>
    `;

    div.onclick = () => selectGlobalStudent(sv);
    box.appendChild(div);
  });

  box.classList.remove("hidden");
}

let globalSearchTimer = null;

function globalSearchSV() {
  clearTimeout(globalSearchTimer);
  globalSearchTimer = setTimeout(runGlobalSearch, 350);
}

async function runGlobalSearch() {
  const keyword = document.getElementById("globalSearch").value;
  const box = document.getElementById("globalResult");

  if (!keyword.trim()) {
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }

  box.innerHTML = `<div class="p-2 text-gray-500">Đang tìm...</div>`;
  box.classList.remove("hidden");

  try {
    // Query prefix + limit 20: chỉ đọc vài chục bản ghi thay vì cả 5.000
    const { searchStudents } = await import("./student-data.js");
    const allow = new Set(favKhoa(getCoso()));
    const matched = (await searchStudents(keyword, 20))
      .filter((sv) => allow.has(sv.khoa));

    renderGlobalResults(matched, keyword);
  } catch (e) {
    console.error(e);
    box.innerHTML = `<div class="p-2 text-red-500">Lỗi tìm kiếm: ${escHtml(e.message || e)}</div>`;
  }
}

// START
async function loadStudents() {
  try {
    // Chỉ đọc 1 document nhỏ "meta/studentTree" thay vì quét toàn bộ students.
    const { getStudentTree } = await import("./student-data.js");
    const tree = await getStudentTree();

    // Chỉ giữ các khoa thuộc cơ sở đã chọn
    const allow = new Set(favKhoa(getCoso()));
    const dataTree = {};

    Object.keys(tree).forEach((khoa) => {
      if (!allow.has(khoa)) return;

      dataTree[khoa] = {};
      Object.keys(tree[khoa] || {}).forEach((khoaHoc) => {
        dataTree[khoa][khoaHoc] = {};
        Object.keys(tree[khoa][khoaHoc] || {}).forEach((lop) => {
          // Danh sách SV của lớp sẽ được tải khi người dùng bấm vào lớp.
          dataTree[khoa][khoaHoc][lop] = [];
        });
      });
    });

    data = dataTree;

    // Dòng thông báo cơ sở đang dùng — chỉ ghi ngắn gọn
    const cosoLine = document.getElementById("cosoline");
    if (cosoLine) {
      cosoLine.innerText = "Cơ sở: " + getCoso();
    }

    showKhoa();
    loadData();
  } catch (e) {
    console.error(e);
    alert("Lỗi tải danh sách SV từ Firebase.\n" + (e.message || e));
  }
}

loadStudents();
</script>
