    updateStatus();
    showKhoaHoc(khoa);
  });
}

function sortKhoaHocKeys(keys) {
  function rank(name) {
    const s = String(name)
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "") // bỏ dấu để bắt "CĐ" / "CD"
      .replace(/\s+/g, "");

    // CĐ9+K5 / CD9+K5 / CĐ9K5
    let m = s.match(/CD9\+?K(\d+)/) || s.match(/CĐ9\+?K(\d+)/);
    if (m) return 100 + Number(m[1]); // 105, 106, 107...

    // CĐ K18 / CDK18 / K18
    m = s.match(/CDK(\d+)/) || s.match(/[^A-Z]K(\d+)$/) || s.match(/^K(\d+)/);
    if (m) return 200 + Number(m[1]); // 218, 219, 220...

    // còn lại
    m = s.match(/K(\d+)/);
    if (m) return 300 + Number(m[1]);
    return 900;
  }

  return [...keys].sort((a, b) => {
    const d = rank(a) - rank(b);
    if (d !== 0) return d;
    return String(a).localeCompare(String(b), "vi");
  });
}

function showKhoaHoc(khoa) {
  selected.khoa = khoa;
  selected.khoaHoc = null;
  selected.lop = null;
  selected.sv = null;
  updateStatus();

  document.getElementById("title").innerText = "Chọn khóa";

  const raw = Object.keys(data[khoa] || {});
  const keys = sortKhoaHocKeys(raw);

  // Gỡ comment dòng dưới nếu muốn xem trên Console (F12) tên khóa thực tế
  // console.log("Khóa raw:", raw, "→ sorted:", keys);

  renderButtons(keys, khoaHoc => {
    history.push(() => showKhoaHoc(khoa));
    selected.khoaHoc = khoaHoc;
    updateStatus();
    showLop(khoa, khoaHoc);
  });
}

function showLop(khoa, khoaHoc) {

  selected.sv = null;

    history.push(() => showLop(khoa, khoaHoc));
    selected.lop = lop;
    updateStatus();
    showSinhVien(khoa, khoaHoc, lop);
  });
}

</div>

// ================= ADD VIOLATION =================
function addViolation() {
  const date = document.getElementById("date").value;
  const buoi = document.getElementById("buoi").value;

  if (!date) {
    alert("Vui lòng chọn ngày!");
    return;
  }

  let violations = [];


  // 1. Lỗi có sẵn
  document.querySelectorAll(".vipham:checked").forEach(cb => {
    violations.push(cb.value);
  });

  // 2. Lỗi khác
  const otherCheckbox = document.getElementById("viphamKhac");
  const otherInput = document.getElementById("otherViolation");

  if (otherCheckbox.checked) {
    if (otherInput.value.trim() === "") {
      alert("Vui lòng nhập lỗi vi phạm khác!");
      return;
    }
    violations.push(otherInput.value.trim());
  }

  if (violations.length === 0) {
    alert("Chưa chọn lỗi vi phạm!");
    return;
  }
  // 3. Thêm vào danh sách
  violationList.push({
    "Mã SV": selected.sv.maSV,
    "Họ tên": selected.sv.tenSV,
    "Lớp": selected.lop,
    "Khóa": selected.khoaHoc,
    "Khoa": selected.khoa,
    "Ngày": date,
    "Buổi": buoi.toUpperCase().replace("Á", "A").replace("Ề", "E"), // SANG / CHIEU
    "Vi phạm": violations.join(", "),
    "Người nhập": localStorage.getItem("nguoiNhap")
  });

  saveData();
  renderViolationTable();

  alert("Đã thêm vào danh sách vi phạm");
}


// ================= EXPORT =================
async function exportExcel() {
  if (violationList.length === 0) {
    alert("Chưa có dữ liệu!");
    return;
  }

  if (isSending) return;

  if (!confirm("Gửi dữ liệu lên hệ thống chung?")) return;

  isSending = true;

  try {
    await window.sendViolations(violationList);
    alert("Đã gửi thành công!");
    violationList = [];
    saveData();
    renderViolationTable();
  } catch (e) {
    console.error(e);
    // sendViolations đã gỡ khỏi violationList những bản gửi THÀNH CÔNG,
    // nên giờ đây chỉ còn phần CHƯA gửi → lưu lại phần đó
    saveData();
    renderViolationTable();
    alert("Gửi thất bại. Kiểm tra mạng rồi thử lại.\nPhần chưa gửi vẫn còn trên máy, không bị mất.");
  }

  isSending = false;
}

//AUTOCOMPLETE
function autoCompleteSV(khoa, khoaHoc, lop) {
  const keyword = document.getElementById("searchSV").value;
  const box = document.getElementById("suggestBox");

  if (!keyword.trim()) {
    box.classList.add("hidden");
    return;
  }

  const list = data[khoa][khoaHoc][lop].filter(sv =>
    matchesSearch(sv, keyword, { khoa, khoaHoc, lop })
  );

  box.innerHTML = "";
  box.classList.remove("hidden");

  list.forEach(sv => {
    const div = document.createElement("div");
    div.className = "p-2 hover:bg-blue-100 cursor-pointer";

    div.innerHTML = `
      <div class="font-medium">${sv.tenSV}</div>
      <div class="text-xs text-gray-500">${sv.maSV}</div>
    `;

    div.onclick = () => {
      document.getElementById("searchSV").value = `${sv.tenSV} (${sv.maSV})`;
      box.classList.add("hidden");

      history.push(() => showSinhVien(khoa, khoaHoc, lop));
      selected.sv = sv;
      showViPham();
    };

    box.appendChild(div);
  });
}

function getAllSinhVien() {
  const result = [];

  for (const khoa in data) {
    for (const khoaHoc in data[khoa]) {
      for (const lop in data[khoa][khoaHoc]) {
        data[khoa][khoaHoc][lop].forEach(sv => {
          result.push({
            ...sv,
            khoa,
            khoaHoc,
            lop
          });
        });
      }
    }
  }

  return result;
}
function normText(s) {
  return String(s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// Khớp khi MỌI từ khóa đều có trong: tên / mã SV / lớp / khóa / khoa.
// Gõ "nguyễn hoàng k5", "Nguyễn Hoàng K5" hay "nguyen hoang k5" đều được.
function matchesSearch(sv, keyword, extra) {
  const tokens = normText(keyword).split(" ").filter(Boolean);
  if (tokens.length === 0) return false;
  const hay = normText(
    [sv.tenSV, sv.maSV, extra.lop, extra.khoaHoc, extra.khoa].join(" ")
  );
  return tokens.every(t => hay.includes(t));
}

function globalSearchSV() {
  const keyword = document
    .getElementById("globalSearch")
    .value;

  const box = document.getElementById("globalResult");

  if (!keyword.trim()) {
    box.classList.add("hidden");
    return;
  }

  const allSV = getAllSinhVien();

  const matched = allSV.filter(sv =>
    matchesSearch(sv, keyword, {
      khoa: sv.khoa,
      khoaHoc: sv.khoaHoc,
      lop: sv.lop
    })
  );

  box.innerHTML = "";

  if (matched.length === 0) {
    box.innerHTML = `<div class="p-2 text-gray-500">Không tìm thấy</div>`;
    box.classList.remove("hidden");
    return;
  }

  matched.forEach(sv => {
    const div = document.createElement("div");
    div.className = "p-2 hover:bg-blue-100 cursor-pointer";

    div.innerHTML = `
      <div class="font-medium">${sv.tenSV}</div>
      <div class="text-xs text-gray-500">
        ${sv.maSV} — ${sv.lop} — ${sv.khoaHoc}
      </div>
    `;

    div.onclick = () => {
  box.classList.add("hidden");
  document.getElementById("globalSearch").value = "";

  // RESET HISTORY (rất quan trọng)
  history = [];

  // PUSH LẠI ĐẦY ĐỦ LUỒNG
  history.push(showKhoa);
  history.push(() => showKhoaHoc(sv.khoa));
  history.push(() => showLop(sv.khoa, sv.khoaHoc));
  history.push(() => showSinhVien(sv.khoa, sv.khoaHoc, sv.lop));

  // SET STATE
  selected.khoa = sv.khoa;
  selected.khoaHoc = sv.khoaHoc;
  selected.lop = sv.lop;
  selected.sv = { tenSV: sv.tenSV, maSV: sv.maSV };

  updateStatus();
  showViPham();
};

    box.appendChild(div);
  });

  box.classList.remove("hidden");
}

      "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"
    );

    const snap = await getDocs(collection(db, "students"));
    const tree = {};

    // Chỉ giữ các khoa thuộc cơ sở đã chọn
    const allow = new Set(favKhoa(getCoso()));

    snap.forEach(d => {
      const s = d.data();
      const khoa = s.khoa || "";
      const khoaHoc = s.khoaHoc || "";
      const lop = s.lop || "";
      if (!khoa || !khoaHoc || !lop) return;
      if (!allow.has(khoa)) return; // bỏ khoa của cơ sở khác

      if (!tree[khoa]) tree[khoa] = {};
      if (!tree[khoa][khoaHoc]) tree[khoa][khoaHoc] = {};
      if (!tree[khoa][khoaHoc][lop]) tree[khoa][khoaHoc][lop] = [];

      tree[khoa][khoaHoc][lop].push({
        maSV: s.maSV || d.id,
        tenSV: s.tenSV || ""
      });
    });

    data = tree;

    // Dòng thông báo cơ sở đang dùng — chỉ ghi ngắn gọn
    const cosoLine = document.getElementById("cosoline");
    if (cosoLine) {
      cosoLine.innerText = "Cơ sở: " + getCoso();
    }

    showKhoa();
    loadData();
  } catch (e) {
    console.error(e);
    alert("Lỗi tải danh sách SV từ Firebase.\n" + (e.message || e));
  }
}

loadStudents();
</script>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

let rankPeriod = "month"; // "week" | "month"
let rankCache = null;
let rankCacheAt = 0;
let rankLoading = false;

// Gộp tên không phân biệt HOA/thường, bỏ khoảng trắng thừa
function normName(s) {
  return String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
}
// Tách "Đi trễ, Hút thuốc, Mang dép" → ["Đi trễ", "Hút thuốc", "Mang dép"]
function splitLoi(vipham) {
  return String(vipham || "").split(",").map(s => s.trim()).filter(Boolean);
}
function fmtDate(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
// Tuần tính từ thứ Hai → Chủ nhật
function currentWeekRange() {
  const now = new Date();
  const diffToMonday = (now.getDay() + 6) % 7;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
  return { start: fmtDate(start), end: fmtDate(end) };
}

async function loadRanking(force) {
  const listEl = document.getElementById("rankList");
  if (rankLoading) return;
  if (!force && rankCache && Date.now() - rankCacheAt < 30000) {
    renderRanking(rankCache);
    return;
  }
  rankLoading = true;
  listEl.innerHTML = '<div class="text-center text-gray-400 py-6">Đang tải...</div>';
  try {
    const snap = await getDocs(collection(db, "violations"));
    const nowD = new Date();
    const monthKey = nowD.getFullYear() + "-" + String(nowD.getMonth() + 1).padStart(2, "0");
    const week = currentWeekRange();

    const map = new Map();
    snap.forEach(doc => {
      const v = doc.data();
      const ngay = String(v.ngay || "");
      const inMonth = ngay.startsWith(monthKey);
      const inWeek = ngay >= week.start && ngay <= week.end;
      if (!inMonth && !inWeek) return;

      const raw = String(v.nguoiNhap || "").trim();
      if (!raw) return;

      const key = normName(raw);
      if (!map.has(key)) {
        map.set(key, {
          name: raw.replace(/\s+/g, " "),
          countMonth: 0, countWeek: 0,   // số DÒNG đã nhập
          loiMonth: 0, loiWeek: 0        // số LỖI bắt được
        });
      }
      const item = map.get(key);
      const lois = splitLoi(v.vipham);
      if (inMonth) {
        item.countMonth++;              // 1 bản ghi = 1 dòng
        item.loiMonth += lois.length;   // "Đi trễ, Hút thuốc, Mang dép" = 3 lỗi
      }
      if (inWeek) {
        item.countWeek++;
        item.loiWeek += lois.length;
      }
    });

    rankCache = [...map.values()];
    rankCacheAt = Date.now();
    renderRanking(rankCache);
  } catch (e) {
    console.error(e);
    listEl.innerHTML = '<div class="text-center text-red-500 py-6">Không tải được dữ liệu. Kiểm tra mạng rồi thử lại.</div>';
  } finally {
    rankLoading = false;
  }
}

function renderRanking(list) {
  const el = document.getElementById("rankList");
  const isMonth = rankPeriod === "month";
  const countKey = isMonth ? "countMonth" : "countWeek";
  const loiKey = isMonth ? "loiMonth" : "loiWeek";
  document.getElementById("rankNote").textContent = isMonth
    ? "Hết tháng tự reset."
    : "Hết tuần tự reset.";

  const sorted = list
    .map(x => ({
      name: x.name,
      rows: x[countKey] || 0,   // số dòng nhập
      loi: x[loiKey] || 0       // số lỗi bắt được
    }))
    .filter(x => x.rows > 0 || x.loi > 0)
    .sort((a, b) => b.loi - a.loi || b.rows - a.rows);

  el.innerHTML = "";
  if (sorted.length === 0) {
    el.innerHTML = '<div class="text-center text-gray-400 py-6">Chưa có dữ liệu trong kỳ này.</div>';
    return;
  }

  const medals = ["🥇", "🥈", "🥉"];
  sorted.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "flex items-center gap-3 p-2 rounded-lg bg-gray-50 border border-gray-100";

    const badge = document.createElement("div");
    badge.className =
      "w-9 h-9 flex items-center justify-center rounded-full text-lg shrink-0 " +
      (i === 0 ? "bg-amber-100" : i === 1 ? "bg-slate-200" : i === 2 ? "bg-orange-100" : "bg-gray-100 text-gray-400");
    badge.textContent = medals[i] || String(i + 1);

    const wrap = document.createElement("div");
    wrap.className = "flex-1 min-w-0";
    const name = document.createElement("div");
    name.className = "font-semibold text-gray-800 truncate";
    name.textContent = item.name;

    // Số lỗi bắt được — nhỏ, màu xám nhạt (không ghi ra từng loại)
    const sub = document.createElement("div");
    sub.className = "text-xs text-gray-400";
    sub.textContent = item.loi + " lỗi";
    wrap.appendChild(name);
    wrap.appendChild(sub);

    // Số DÒNG đã nhập — lớn, đậm
    const num = document.createElement("div");
    num.className = "text-xl font-bold " + (i === 0 ? "text-amber-500" : "text-gray-600");
    num.textContent = item.rows;

    row.append(badge, wrap, num);
    el.appendChild(row);
  });
}

function setRankPeriod(p) {
  rankPeriod = p;
  document.getElementById("rankWeek").classList.toggle("active", p === "week");
  document.getElementById("rankMonth").classList.toggle("active", p === "month");
  loadRanking(false);
}
window.setRankPeriod = setRankPeriod;

window.openRanking = () => {
  document.getElementById("rankingModal").classList.remove("hidden");
  loadRanking(false);
};
window.closeRanking = () => {
  document.getElementById("rankingModal").classList.add("hidden");
};
</script>
